understand_user_intent:
  description: >
    分析用户的输入 "{topic}"，理解用户的真实需求。
    可能是以下场景之一：
    1. 询问调酒知识（如"马天尼怎么做"）
    2. 请求饮品推荐（如"我今天心情不好，推荐一杯"、"夏天适合喝什么"）
    3. 询问食物搭配（如"这个配方配什么小吃好"）
    4. 请求平台导航帮助（如"怎么创建配方"）
    5. 一般聊天
    请总结用户意图和关键偏好信息（如口味、心情、场合等）。
  expected_output: >
    用1-2句话总结用户意图，以及提取出的关键偏好信息。
  agent: head_bartender

generate_response:
  description: >
    根据对用户意图的理解，生成专业、热情、有帮助的回复。

    如果需要推荐饮品，请使用工具查询平台中的真实配方数据。
    如果需要食物搭配建议，请使用工具查询搭配选项。

    回复结构建议：
    - 亲切的问候/共情
    - 核心推荐或回答（包含具体配方名称、材料、特点）
    - 补充建议（如搭配、替代方案）
    - 引导用户进一步探索
  expected_output: >
    一段结构清晰、热情专业的回复，包含具体的推荐内容和实用建议。
  agent: head_bartender
